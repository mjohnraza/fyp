[project]
name = "agentic-entrepreneur-os"
version = "0.1.0"
description = "Agentic Entrepreneur OS: A Wealth-Formation Opportunity Discovery Pipeline (FYP-I Deliverable)"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "FAST NUCES FYP Team", email = "fyp@nu.edu.pk" },
    { name = "Muhammad Fareed Mughal", email = "mfareedmughalinfo@gmail.com" },
    { name = "FAST NUCES Student", email = "k232022@nu.edu.pk" }
]
contributors = [
    { name = "Muhammad Fareed Mughal", email = "mfareedmughalinfo@gmail.com" },
    { name = "FAST Student", email = "k232022@nu.edu.pk" }
]
dependencies = [
    "pydantic>=2.7.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "networkx>=3.2.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.3",
    "rich>=13.7.0",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.9",
    "scikit-learn>=1.4.0",
    "numpy>=1.26.0",
    "pytest>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.0",
]

[project.scripts]
agentic-os = "src.agentic_os.cli.main:main"
agentic-api = "src.agentic_os.api.app:start"
agentic-mcp = "mcp_servers.agentic_os_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_os", "mcp_servers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
